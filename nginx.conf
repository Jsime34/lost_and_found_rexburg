# nginx settings for the Rexburg Lost & Found website (used by the Dockerfile).

server {
    listen 80;
    server_name _;

    # The website files (copied from public/ by the Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # Don't tell visitors which nginx version we run.
    server_tokens off;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text files so pages load faster.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Same as firebase.json: browsers must always check for the newest version of our
    # pages, scripts and styles, so everyone sees changes right after a new deploy.
    location ~* \.(html|js|css)$ {
        expires -1;
        try_files $uri =404;
    }

    # Images rarely change, so browsers may keep them for a day.
    location ~* \.(png|jpe?g|gif|webp|svg|ico)$ {
        expires 1d;
        try_files $uri =404;
    }

    # Never serve hidden files (like .git or .env) if one ends up in the folder.
    location ~ /\. {
        deny all;
    }
}
