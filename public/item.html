<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details | Rexburg Lost &amp; Found</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .item-details { background: white; border: 1px solid #e2e8f0; border-radius: 15px; padding: 30px; display: grid; grid-template-columns: minmax(240px, 1fr) 1.4fr; gap: 30px; }
        .item-details-photo { min-height: 280px; background: #e8f3f7; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 6rem; overflow: hidden; }
        .item-details-photo img { width: 100%; height: 100%; min-height: 280px; object-fit: cover; }
        .item-details h2 { margin-bottom: 12px; }
        .detail-list { list-style: none; margin: 20px 0; }
        .detail-list li { padding: 9px 0; border-bottom: 1px solid #e2e8f0; }
        .detail-list strong { display: inline-block; min-width: 125px; }
        .item-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .item-actions a { text-decoration: none; text-align: center; }
        .detail-message { margin-top: 20px; }
        @media (max-width: 700px) { .item-details { grid-template-columns: 1fr; padding: 20px; } }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-icon">🎒</span>
            <div>
                <h1>Rexburg Lost &amp; Found</h1>
                <p>Find items turned in around campus.</p>
            </div>
        </div>
        <nav aria-label="Main navigation">
            <a class="nav-btn" href="index.html">Search</a>
            <a class="nav-btn" href="map.html">Map</a>
            <a class="nav-btn" href="login.html">Log in</a>
        </nav>
    </header>

    <main>
        <a href="index.html" class="text-btn">← Back to search</a>
        <section class="page-title" style="margin-top: 25px;">
            <span class="eyebrow">ITEM DETAILS</span>
            <h2 id="pageHeading">Loading item...</h2>
        </section>

        <div id="itemMessage" class="report-card" role="status">Loading item details...</div>
        <article id="itemDetails" class="item-details hidden"></article>
    </main>

    <footer><p>Rexburg Lost &amp; Found</p></footer>
    <script type="module" src="js/item.js"></script>
</body>
</html>
