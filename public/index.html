<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rexburg Lost &amp; Found</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-icon">🎒</span>
            <div>
                <h1>Rexburg Lost &amp; Found</h1>
                <p>Find items turned in around campus.</p>
            </div>
        </div>
        <nav aria-label="Main navigation">
            <a class="nav-btn active" href="index.html">Search</a>
            <a class="nav-btn" href="map.html">Map</a>
            <a class="nav-btn" href="login.html">Log in</a>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <span class="eyebrow">SEARCH</span>
            <h2>Find your lost item</h2>
            <p>Search the items currently recorded by Rexburg lost-and-found desks.</p>
        </section>

        <form id="searchForm" class="search-panel" aria-label="Search found items">
            <label class="sr-only" for="keywordSearch">Search words</label>
            <input id="keywordSearch" type="search" placeholder="Search type, color, brand, or description...">

            <label class="sr-only" for="typeFilter">Type</label>
            <select id="typeFilter"><option value="">All types</option></select>

            <label class="sr-only" for="colorFilter">Color</label>
            <select id="colorFilter"><option value="">All colors</option></select>

            <label class="sr-only" for="brandFilter">Brand</label>
            <select id="brandFilter"><option value="">All brands</option></select>

            <label class="sr-only" for="locationFilter">Location</label>
            <select id="locationFilter"><option value="">All locations</option></select>

            <label class="sr-only" for="sortOrder">Sort order</label>
            <select id="sortOrder">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
            </select>

            <button class="secondary-btn" id="clearSearch" type="button">Clear filters</button>
        </form>

        <p id="resultsText" class="results-text" aria-live="polite">Loading items...</p>
        <div id="searchMessage" class="report-card hidden" role="status"></div>
        <div id="resultsGrid" class="item-grid" aria-live="polite"></div>
    </main>

    <footer><p>Rexburg Lost &amp; Found</p></footer>
    <script type="module" src="js/search.js"></script>
</body>
</html>
